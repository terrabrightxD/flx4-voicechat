name: Publish first alpha release
on:
  push:
    branches: [main]
    paths: [.github/workflows/first-release.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: first-alpha-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified build
        run: |
          gh run download 41193393803 --name flx4-voicechat-26.3 --dir artifact
          python3 - <<'PY'
          import json, pathlib, zipfile
          jars = list(pathlib.Path("artifact").rglob("*.jar"))
          assert len(jars) == 1, jars
          assert jars[0].name == "flx4-voicechat-0.2.0-alpha.1.jar"
          with zipfile.ZipFile(jars[0]) as z:
              mod = json.loads(z.read("fabric.mod.json"))
              assert mod["version"] == "0.2.0-alpha.1", mod
              assert "de.terrabright.flx4.FlxClient" in mod["entrypoints"]["client"]
          PY
      - name: Publish JAR as first prerelease
        run: |
          cat > notes.md <<'NOTES'
          First alpha release for Minecraft Java 26.3 (Fabric, Windows).

          - Send your Rekordbox/DDJ-FLX4 mix through a virtual audio cable into Simple Voice Chat.
          - Native Minecraft menu opened with F8 (rebindable), with input selection, start/stop, volume and a level meter.
          - Escape closes the menu while music continues playing.

          Installation: Put the attached JAR in your mods folder and remove older versions of this mod.
          Requires Java 25, Fabric Loader 0.19.5+, Fabric API 0.160.5+26.3 or newer for 26.3, and Simple Voice Chat 2.6.27+ for 26.3.

          Compilation and 13 audio checks passed. In-game UI and FLX4/multiplayer listening tests are still pending. Audio is transmitted in mono.

          This original release JAR has a German menu. English UI support is available in development builds starting with 0.2.0-alpha.2; the attached binary has not been replaced.

          Setup guide: https://github.com/terrabrightxD/flx4-voicechat#readme
          NOTES
          if gh release view v0.2.0-alpha.1 >/dev/null 2>&1; then
            gh release edit v0.2.0-alpha.1 --title "FLX4 Voice Chat 0.2.0 Alpha – First Release" --notes-file notes.md
            exit 0
          fi
          gh release create v0.2.0-alpha.1 artifact/*.jar \
            --target 70548eaeddc2ecad598cc659da0ddd632a60e3a9 \
            --title "FLX4 Voice Chat 0.2.0 Alpha – First Release" \
            --notes-file notes.md --prerelease
