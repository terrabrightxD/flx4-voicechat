plugins { id 'net.fabricmc.fabric-loom' version '1.17.21' }
group = 'de.terrabright'
version = '0.2.0-alpha.2'
repositories {
    mavenCentral()
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.160.5+26.3'
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.27'
}
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
sourceSets {
    audioTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('audioTest', JavaExec) {
    dependsOn audioTestClasses
    classpath = sourceSets.audioTest.runtimeClasspath
    mainClass = 'de.terrabright.flx4.AudioTest'
}
check.dependsOn audioTest
jar { from('LICENSE') }
